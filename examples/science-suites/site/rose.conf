# examples/science-suites/site/rose.conf — the rosie prefix map, for Isambard 3.
#
# WHY THIS EXISTS. `rosie` ships in the environment Stage 1 builds (it is part of
# metomi-rose, a dependency of lfric-apps-isambard, so `module load` puts it on PATH).
# But the spack package installs vanilla rose, with no SITE configuration — and rosie
# is useless without one:
#
#     $ rosie checkout u-dn704
#     [FAIL] u: cannot determine prefix location
#
# On a Met Office workstation that mapping comes from the site's own rose.conf. There
# is no Met Office site install on Isambard 3, so we supply the one section rosie needs
# to resolve the `u-` prefix. `site/activate-env.sh` points ROSE_SITE_CONF_PATH here.
#
# This is [isambard3] in the same sense as the `isambard3` Slurm platform: not a change
# to how anything works, just the site fact that a foreign site would have told rose.
# It is deliberately ONLY [rosie-id] — nothing here changes `rose task-run`, `rose
# app-upgrade`, or anything a suite task does.
#
# AUTHENTICATION IS SEPARATE AND STILL REQUIRED. roses-u is not anonymously readable:
#
#     $ svn info https://code.metoffice.gov.uk/svn/roses-u/d/n/7/0/4/trunk
#     svn: E170013: Unable to connect to a repository at URL '...'
#     svn: E215004: No more credentials or we tried too many times.
#
# You need a Met Office Science Repository Service (MOSRS) account, and svn needs your
# password cached. See examples/science-suites/README.md, "Getting a suite from MOSRS".
#
# NOTE that `rosie checkout` shells out to `svn checkout` (metomi/rosie/vc.py). Stock
# /usr/bin/svn is present on the Isambard 3 login nodes and is sufficient: the Met
# Office's patched svn matters for FCM keyword expansion and commits, not for reading a
# suite out of roses-u.

[rosie-id]
prefix-default=u
prefix-location.u=https://code.metoffice.gov.uk/svn/roses-u
prefix-web.u=https://code.metoffice.gov.uk/trac/roses-u/intertrac/source:
prefix-ws.u=https://code.metoffice.gov.uk/rosie/u
