# This file contains a list of all linked external repositories containing code
# and data required to build lfric applications and run the entire test suite
#
# Each section is the name of the repository
# source: Is either the url to the repository (the upstream or
#         a fork) or a path to a local clone with format `host:/path/to/clone`
# ref: Is a valid git reference. This can either be a commit hash, a tag or a
#      branch name
#
# Multiple branches can also be set, fork example:
#
# lfric_apps:
#     - source: git@github.com:MetOffice/lfric_apps.git
#       ref: 2025.12.1
#     - source: git@github.com:my_fork/lfric_apps.git
#       ref: my_branch
#
# It is up to the user to ensure these merge cleanly

# [isambard3] CHANGED: 2026.03.1 -> 2026.07.1 throughout, and lfric_apps back to
# MetOffice mainline. Upstream this file reads
#
#   lfric_apps:
#       - source: git@github.com:tommbendall/lfric_apps.git
#         ref: 4d8b92147dd938318f0e064e5ad4ed632f8898bf  # TBendall/deep_hot_jupiter_forcing
#
# because at 2026.03.1 (vn3.1) the deep hot Jupiter forcing existed only on that
# fork. It has since landed in mainline: 2026.07.1 (vn3.2) carries
# science/gungho/source/kernel/external_forcing/deep_hot_jupiter_forcings_mod.F90
# and `theta_forcing='deep_hot_jupiter'` in the lfric-gungho vn3.2 metadata, which
# is what this suite's CASE_SETUP='' selects. So the fork is no longer needed.
#
# 2026.07.1 is also what this repo's environment was built and validated against,
# and what its vendored submodules are pinned at — so the `mirrors` extract path
# can serve these refs offline. Building a different ref is the normal upstream
# edit: change it here (and, for the mirrors path, fetch it into the submodule
# first — see vendor/mirrors/README.md).

casim:
    source: git@github.com:MetOffice/casim.git
    ref: 2026.07.1

jules:
    source: git@github.com:MetOffice/jules.git
    ref: 2026.07.1

lfric_apps:
    source: git@github.com:MetOffice/lfric_apps.git
    ref: 2026.07.1

lfric_core:
    source: git@github.com:MetOffice/lfric_core.git
    ref: 2026.07.1

socrates:
    source: git@github.com:MetOffice/socrates.git
    ref: 2026.07.1

ukca:
    source: git@github.com:MetOffice/ukca.git
    ref: 2026.07.1
