# u-dr932 — GungHo Shallow/Deep Hot Jupiter Temperature Forcing.
#
# The template variables below are Denis Sergeev's own working configuration, the
# one whose slow running on Isambard 3 prompted staging/dr932-mpi-scaling/: deep hot
# jupiter (CASE_SETUP=''), C48 multigrid, base l66/4000 km levels, a mesh stretched
# by 0.5 towards (-90, 0), dt = 50 s, 108 ranks, gnu. Only EXPT_RUNLEN is ours — see
# the note on it below.
#
# The three [file:bin/*] sections are the upstream ones with `git:localmirrors:`
# replaced by the github https URL: `localmirrors:` needs a Met Office git alias
# that does not exist here. These install at `cylc install` time on the login node.
# The repositories are public, so no token or SSO is needed.
[file:bin/get_git_sources.py]
source=git:https://github.com/MetOffice/SimSys_Scripts.git::github_scripts/get_git_sources.py::main

[file:bin/merge_sources.py]
source=git:https://github.com/MetOffice/SimSys_Scripts.git::github_scripts/merge_sources.py::main

[file:bin/tweak_iodef]
mode=auto
source=git:https://github.com/MetOffice/lfric_core.git::bin/tweak_iodef::main

[template variables]
BUILD_LFRIC=true
CASE_SETUP=''
COMPILER='gnu'
EXPT_DT=50
EXPT_RESUB='P10D'
# [isambard3] CHANGED: Denis runs EXPT_RUNLEN='P1200D' — 120 cycles of 10 days, a
# multi-week campaign. One cycle is what an example should launch by default; it is
# the same 17280-timestep job either way. Set it back to 'P1200D' (or pass
# `-S EXPT_RUNLEN=P1200D`) for the full run.
EXPT_RUNLEN='P10D'
EXPT_START='20000101T0000Z'
HOUSEKEEPING=true
LFRIC_CPU='PT10H'
LFRIC_LEVS=''
LFRIC_RES='C48_MG'
# [isambard3] MIRROR_LOC is upstream's value and is unused here: there is no Met
# Office mirror host on Isambard 3, so USE_MIRRORS goes false and USE_TOKENS true —
# https clones from github, which work anonymously for these public repositories. To
# extract offline from this repo's vendored submodules instead, pass both at launch:
#   run-suite.sh u-dr932 -S USE_MIRRORS=true -S "MIRROR_LOC='$PWD/vendor/mirrors'"
MIRROR_LOC="localmirrors:"
MO_EX_HOST='ex'
PHYSICS_CONF='stability'
STRETCH_FACTOR=0.5
TARGET_LONLAT=-90.0,0.0
TOTAL_RANKS_REQ=108
USE_MIRRORS=false
USE_TOKENS=true
# [isambard3] CHANGED: '3.1' -> '3.2', matching the refs in dependencies.yaml and
# the `meta=` of the app configs. Nothing in the suite or the build reads it.
VN='3.2'
