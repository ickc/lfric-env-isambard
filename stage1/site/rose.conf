# stage1/site/rose.conf — the Rose SITE configuration the environment ships.
#
# gen-modulefile.sh copies it to $LFRIC_PREFIX/etc/rose/rose.conf and the
# modulefile points ROSE_SITE_CONF_PATH there, so `rosie checkout u-...` works
# straight after `module load` (#21). Without it rosie fails with
#     [FAIL] u: cannot determine prefix location
# because there is no Met Office site install on Isambard 3 to supply the map.
#
# Deliberately ONLY [rosie-id]: a site fact, like the `isambard3` platform —
# nothing here changes `rose task-run`, `rose app-upgrade` or any suite task.
# The modulefile leaves an existing ROSE_SITE_CONF_PATH alone.
#
# Reading roses-u still needs a MOSRS account and a cached svn password; see
# examples/science-suites/README.md, "Getting a suite from MOSRS".

[rosie-id]
prefix-default=u
prefix-location.u=https://code.metoffice.gov.uk/svn/roses-u
prefix-web.u=https://code.metoffice.gov.uk/trac/roses-u/intertrac/source:
prefix-ws.u=https://code.metoffice.gov.uk/rosie/u
