[workspace]
name = "lfric-env-isambard"
version = "0.1.0"
description = "Examples built on the LFRic Apps environment for Isambard 3: a minimal lfric_atm compile, and three real Rose/Cylc science suites."
channels = ["conda-forge"]
platforms = ["linux-aarch64"]

[dependencies]
# A python for the odd helper script. The examples themselves use the python
# that `module load lfric-env/...` puts on PATH, not this one.
python = "3.11.*"

# BUILDING the environment does NOT live here — it is stage1/, which has its own
# pixi workspace and is the only place pixi is required. See stage1/README.md.
#
# Nothing below needs pixi either: every task is a one-line wrapper around a
# script you can run directly, and the examples need only `module load`. This
# file is a convenience, and it is on the list of things to reconsider when the
# examples are ported (see PLAN.md).

# common.sh works out which built environment to load; activate.sh module-loads
# it. Both are no-ops until Stage 1 has been built.
[activation]
scripts = ["scripts/common.sh", "scripts/activate.sh"]

[tasks]
# --- Sources the examples compile from --------------------------------------
# The LFRic source repos. All public, cloned anonymously over HTTPS. These are
# NOT needed to build the environment — Stage 1's own submodules are under
# stage1/vendor/ and are initialised by `pixi run submodules` in there.
init-sources = "git submodule update --init --jobs 4 -- vendor/lfric_apps vendor/lfric_core"
init-physics = "git submodule update --init --jobs 4 -- vendor/physics/casim vendor/physics/jules vendor/physics/socrates vendor/physics/ukca"

# The u-dr932 science suite (Denis Sergeev's repo). u-dn704 and u-dt000 are Met
# Office rose suites in MOSRS subversion, fetched with `rosie checkout` instead —
# nothing to vendor. See examples/science-suites/README.md.
init-suites = "git submodule update --init -- vendor/lfric_egp_bench"

# Stage/update the physics + lfric_core submodules to the refs declared in
# vendor/lfric_apps/dependencies.yaml, then commit the gitlinks. The explicit,
# reproducible way to pull in new science.
stage-physics = "bash scripts/stage-physics.sh"

# --- Patches ----------------------------------------------------------------
# Apply every patches/*-patch.sh in sorted order (idempotent). These are the
# LFRic-source and suite patches; Stage 1's own patch lives in stage1/patches/.
patch = "bash scripts/patch-all.sh"
unpatch = "bash scripts/unpatch.sh"

# --- The examples -----------------------------------------------------------
# Compile lfric_atm on the built environment: the smallest worked example of
# building a science target. Needs init-sources + init-physics.
build-lfric-atm = "bash examples/minimal-compile/build.sh"

# Run a real Rose/Cylc science suite, e.g. `pixi run run-suite u-dr932`. Drives
# cylc on the login node, which submits to Slurm itself — not an sbatch wrapper.
run-suite = "bash examples/science-suites/run-suite.sh"

# Configure cylc (a run dir + the isambard3 Slurm platform) in ~/.cylc. Opt-in,
# idempotent, and deliberately not part of building anything.
setup-cylc = "bash scripts/setup-cylc.sh"

# --- Checks -----------------------------------------------------------------
# Load the environment and report tool versions; a no-op until Stage 1 is built.
activate = "bash scripts/print-versions.sh"
activate-spack = "LFRIC_STACK=spack bash scripts/print-versions.sh"
